[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowforge"
version = "0.1.0"
description = "A lightweight, resilient, developer-first workflow automation and task orchestration engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "eyeblech", email = "0x1123@proton.me"}
]
urls = {Homepage = "https://github.com/eyeblech/flowforge", Repository = "https://github.com/eyeblech/flowforge", Issues = "https://github.com/eyeblech/flowforge/issues"}
keywords = [
    "workflow", "automation", "orchestration", "dag", "asyncio",
    "scheduler", "cron", "webhook", "pipeline", "tasks", "etl"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities"
]
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.3",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "croniter>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.4.0",
    "ruff>=0.3.0"
]

[project.scripts]
flowforge = "flowforge.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowforge*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
